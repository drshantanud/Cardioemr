      properties:
        as_of: {type: string, format: date}
        rule_set: {type: string, examples: [ESC_HF_2021_2023 v1]}
        rule_set_status: {type: string}
        hf_phenotype: {type: string}
        pillars:
          type: array
          items:
            type: object
            properties:
              pillar: {$ref: '#/components/schemas/GdmtPillar'}
              drug_code: {type: [string, 'null']}
              daily_dose: {type: [number, 'null']}
              target_daily_dose: {type: [number, 'null']}
              pct_of_target: {type: [number, 'null']}
              eligible: {type: boolean}
              prescribed: {type: boolean}
              initiation_date: {type: [string, 'null'], format: date}
              last_titration_date: {type: [string, 'null'], format: date}
              dose_status: {type: string, enum: [at_target, below_target_uptitrating, below_target_max_tolerated, not_prescribed, not_indicated]}
              source: {type: string, enum: [engine, clinician_override]}
              reasons: {type: array, items: {type: string}}
        stored: {type: boolean, description: true when read from hf_gdmt_status rather than calculated live}
        pillars_eligible: {type: integer}
        pillars_on_treatment: {type: integer}
        pillars_at_target: {type: integer}

    LipidTargetAttainment:
      type: object
      properties:
        guideline: {type: string, examples: [ESC_EAS_2019 v1, LAI_2020 v1]}
        rule_set_status: {type: string, description: draft until the clinical lead verifies it}
        is_primary: {type: boolean}
        risk_category: {type: string}
        ldl_target_mg_dl: {type: number}
        ldl_mg_dl: {type: [number, 'null']}
        ldl_pct_reduction: {type: [number, 'null']}
        target_met: {type: [boolean, 'null']}
        calculated_at: {type: string, format: date-time}

    PciStent:
      type: object
      required: [sequence_number, diameter_mm, length_mm]
      properties:
        sequence_number: {type: integer, minimum: 1}
        stent_device_id: {type: string, format: uuid}
        device_text: {type: string}
        diameter_mm: {type: number, minimum: 1.5, maximum: 6.0}
        length_mm: {type: number, minimum: 6, maximum: 60}
        deployment_atm: {type: integer, minimum: 4, maximum: 30}
        post_dilatation_balloon_mm: {type: number}

    PciLesion:
      type: object
      required: [lesion_number, vessel, treatment]
      properties:
        lesion_number: {type: integer, minimum: 1}
        vessel: {type: string, enum: [LM, LAD, LCX, RCA, RAMUS, DIAGONAL, OM, PDA, PLV, SVG, LIMA, RIMA, RADIAL_GRAFT]}
        segment_code: {type: string}
        lesion_type_acc_aha: {type: string, enum: [A, B1, B2, C]}
        lesion_length_mm: {type: number, minimum: 1, maximum: 200}
        reference_diameter_mm: {type: number, minimum: 1.5, maximum: 7.0}
        pre_stenosis_pct: {type: integer, minimum: 0, maximum: 100}
        pre_timi_flow: {type: integer, minimum: 0, maximum: 3}
        calcification: {type: string, enum: [none, mild, moderate, severe]}
        is_cto: {type: boolean}
        j_cto_score: {type: integer, minimum: 0, maximum: 5}
        is_bifurcation: {type: boolean}
        medina: {type: string, pattern: '^[01],[01],[01]$'}
        bifurcation_technique: {type: string}
        is_in_stent_restenosis: {type: boolean}
        thrombus: {type: boolean}
        lesion_preparation: {type: array, items: {type: string}}
        post_dilatation: {type: boolean}
        pre_physiology_value: {type: number}
        post_physiology_value: {type: number}
        final_timi_flow: {type: integer, minimum: 0, maximum: 3}
        residual_stenosis_pct: {type: integer, minimum: 0, maximum: 100}
        treatment: {type: string, enum: [stent, DCB, POBA, failed, deferred_by_physiology]}
        stents: {type: array, items: {$ref: '#/components/schemas/PciStent'}}

    PciProcedure:
      type: object
      required: [procedure_date, indication, lesions]
      properties:
        procedure_id: {type: string, format: uuid, readOnly: true}
        encounter_id: {type: string, format: uuid}
        angiogram_investigation_id: {type: string, format: uuid}
        procedure_date: {type: string, format: date}
        performed_at_facility: {type: string}
        indication: {type: string, enum: [primary_pci_stemi, pharmacoinvasive, rescue_pci, nstemi, unstable_angina, chronic_coronary_syndrome, staged, silent_ischaemia, other]}
        urgency: {type: string, enum: [elective, urgent, emergency, salvage]}
        access_site: {type: string, enum: [radial, distal_radial, femoral, brachial, ulnar]}
        imaging_guidance: {type: string, enum: [none, IVUS, OCT, IVUS_and_OCT]}
        physiology: {type: string, enum: [none, FFR, iFR, RFR, QFR, other]}
        mechanical_support: {type: string, enum: [none, IABP, Impella, ECMO]}
        contrast_ml: {type: integer}
        fluoroscopy_min: {type: number}
        procedural_success: {type: boolean}
        complications: {type: array, items: {type: string}}
        source: {type: string, enum: [manual, ai_extracted, imported]}
        source_document_id: {type: string, format: uuid}
        status: {type: string, enum: [draft, final, entered_in_error]}
        lesions: {type: array, minItems: 1, items: {$ref: '#/components/schemas/PciLesion'}}
        row_version: {type: integer, readOnly: true}

    ClinicalEvent:
      type: object
      required: [patient_id, event_type, event_date, source]
      properties:
        event_id: {type: string, format: uuid, readOnly: true}
        patient_id: {type: string, format: uuid}
        event_type: {type: string, enum: [death, mi, stroke, tia, hf_hospitalisation, urgent_hf_visit, worsening_hf_outpatient, pci, cabg, stent_thrombosis, bleeding, hyperkalaemia, hypotension, renal_deterioration, arrhythmia, device_therapy, other_cv_hospitalisation, non_cv_hospitalisation, other]}
        event_date: {type: string, format: date}
        event_date_precision: {type: string, enum: [day, month, year]}
        is_historical: {type: boolean}
        description: {type: string}
        hospitalised: {type: boolean}
        admission_date: {type: string, format: date}
        discharge_date: {type: string, format: date}
        facility_name: {type: string}
        death_cause: {type: string, enum: [cardiovascular, non_cardiovascular, undetermined]}
        death_cv_mode: {type: string}
        mi_type: {type: string, enum: ['1', '2', '3', 4a, 4b, 4c, '5']}
        stroke_type: {type: string, enum: [ischaemic, haemorrhagic, undetermined]}
        bleeding_site: {type: string}
        pci_procedure_id: {type: string, format: uuid}
        target_lesion_id: {type: string, format: uuid}
        source: {type: string, enum: [site_clinician, patient_report, relative_report, hospital_records, death_certificate, follow_up_call, imported]}
        source_document_id: {type: string, format: uuid}

    Adjudication:
      type: object
      properties:
        adjudication_id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        protocol_code: {type: string}
        endpoint_code: {type: [string, 'null']}
        event_type: {type: string}
        event_date: {type: string, format: date}
        endpoint_label: {type: [string, 'null']}
        classification_system: {type: [string, 'null'], enum: [ARC-2, BARC, UDMI-4, HF-ARC, VARC-3, MVARC, custom, null]}
        qualifying_classifications: {type: [array, 'null'], items: {type: string}}
        event_day: {type: [integer, 'null'], description: Days from the enrolment index date}
        adjudication_status: {type: string, enum: [pending, in_review, adjudicated, not_an_event, insufficient_data, event_withdrawn]}
        classification: {type: [string, 'null']}
        meets_endpoint: {type: [boolean, 'null']}
        adjudicated_by: {type: [string, 'null'], format: uuid}
        adjudicated_at: {type: [string, 'null'], format: date-time}
        committee_reference: {type: [string, 'null']}
        notes: {type: [string, 'null']}
        centre_code: {type: string}
        study_subject_code: {type: [string, 'null']}
        patient_id: {type: [string, 'null'], format: uuid, description: Only when the event is at the acting centre}
        event:
          type: object
          description: Event facts for the adjudicator (facility only at the acting centre)
        row_version: {type: integer}

    ExportRequest:
      type: object
      required: [protocol_id, purpose, variable_codes, deidentification, file_format]
      properties:
        protocol_id: {type: string, format: uuid}
        purpose: {type: string, minLength: 10}
        centre_ids: {type: array, items: {type: string, format: uuid}}
        cohort_filter: {type: object}
        visit_codes: {type: array, items: {$ref: '#/components/schemas/VisitCode'}}
        variable_codes: {type: array, minItems: 1, items: {type: string}}
        deidentification: {type: string, enum: [pseudonymised_relative_days, pseudonymised_year_only, aggregate_only]}
        file_format: {type: string, enum: [csv, xlsx, spss_csv, r_csv, stata_csv]}
        include_data_dictionary: {type: boolean, default: true}

    ExportJob:
      allOf:
        - {$ref: '#/components/schemas/ExportRequest'}
        - type: object
          properties:
            export_id: {type: string, format: uuid}
            requested_by: {type: string, format: uuid}
            requested_at: {type: string, format: date-time}
            status: {type: string, enum: [requested, approved, rejected, running, completed, failed, expired]}
            approved_by: {type: [string, 'null'], format: uuid}
            row_count: {type: [integer, 'null']}
            file_sha256: {type: [string, 'null']}
            download_url: {type: [string, 'null'], format: uri, description: Requester only; signed, valid 15 minutes}
            expires_at: {type: [string, 'null'], format: date-time}
            requested_role: {type: string, enum: [research_coordinator, principal_investigator]}
            approved_at: {type: [string, 'null'], format: date-time}
            decision_note: {type: [string, 'null']}
            started_at: {type: [string, 'null'], format: date-time}
            completed_at: {type: [string, 'null'], format: date-time}
            failure_reason: {type: [string, 'null']}
            missing_value_codes: {type: object}
            manifest: {type: [object, 'null'], description: 'What the file holds: tables and row counts, centres, de-identification rules'}
            row_version: {type: integer}
