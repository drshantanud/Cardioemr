openapi: 3.1.0
info:
  title: CardioEMR Registry API
  version: 0.1.0
  summary: Registry side of CardioEMR (HF, lipid, CAD registries) on top of migrations 0001-0006.
  description: |
    Every request runs in one database transaction as login role `cardioemr_api`, which then does
    `SET LOCAL ROLE r_<X-Acting-Role>` and sets `app.user_id`, `app.centre_id` and, when given,
    `app.change_reason`. Row-level security limits every patient row to the acting centre.
    `x-roles` on each operation lists the acting roles allowed; the API checks it before any query.
    Database grants and triggers are the outer limit (for example lock and unlock roles are enforced
    by registry.assessment_lock_guard from migration 0003).
    Database errors carry a stable tag in HINT ('cemr:<CODE>') or a stable constraint name; the API
    translates both through ref.api_error_map.
    Errors are RFC 9457 problem documents; see components/schemas/Problem.
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: cardioemr.example.org
security:
  - oidc: []
tags:
  - name: Session
  - name: Patients
  - name: Consultations
  - name: Medicines
  - name: Protocols
  - name: Suggestions
  - name: Enrolment
  - name: Assessments
  - name: Heart failure
  - name: Lipid
  - name: CAD
  - name: Events
  - name: Reports
  - name: Exports

paths:
  /me:
    get:
      tags: [Session]
      operationId: getMe
      summary: The signed-in user and the centres and roles they hold today (no centre headers)
      x-roles: [any signed-in user]
      responses:
        '200':
          description: User and memberships
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        default: {$ref: '#/components/responses/Problem'}

  /patients:
    parameters: [{$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    get:
      tags: [Patients]
      operationId: listPatients
      summary: Patients registered at the acting centre; q matches local code prefix, mobile digits or name
      x-roles: [assistant, nurse, clinician, research_coordinator, principal_investigator]
      parameters:
        - {name: q, in: query, schema: {type: string, minLength: 1, maxLength: 100}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: include_inactive, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Newest registrations first, or by name when searching
          content:
            application/json:
              schema:
                type: object
                required: [items, has_more]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Patient'}}
                  has_more: {type: boolean}
                  limit: {type: integer}
                  offset: {type: integer}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Patients]
      operationId: registerPatient
      summary: Register a patient at the acting centre (local code generated unless given)
      description: |
        Returns 409 POSSIBLE_DUPLICATE, with the candidates in `current`, when a patient at this centre has
        the same mobile, ABHA number, or name and date of birth; resend with confirm_not_duplicate true.
        The check never looks at other centres.
      x-roles: [assistant, nurse, clinician, research_coordinator, principal_investigator]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewPatient'}
      responses:
        '201':
          description: Registered
          headers: {ETag: {$ref: '#/components/headers/ETag'}, Location: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Patient'}}}
        default: {$ref: '#/components/responses/Problem'}

  /patients/{patientId}:
    parameters: [{$ref: '#/components/parameters/PatientId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    get:
      tags: [Patients]
      operationId: getPatient
      summary: Registration and overview; enrolments and suggestions are null for roles that may not read them
      x-roles: [assistant, nurse, clinician, research_coordinator, principal_investigator]
      responses:
        '200':
          description: Patient overview
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content:
            application/json:
              schema:
                type: object
                properties:
                  patient: {$ref: '#/components/schemas/Patient'}
                  consents: {type: array, items: {type: object}}
                  allergies: {type: array, items: {type: object}}
                  recent_encounters: {type: array, items: {type: object}}
                  enrolments: {type: [array, 'null'], items: {type: object}}
                  registry_suggestions: {type: [array, 'null'], items: {type: object}}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Patients]
      operationId: updatePatient
      summary: Change demographics; omitted fields keep their value
      x-roles: [assistant, nurse, clinician, research_coordinator, principal_investigator]
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/ChangeReasonRequired'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatientDemographics'}
      responses:
        '200':
          description: Updated
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Patient'}}}
        default: {$ref: '#/components/responses/Problem'}

  /patients/{patientId}/consents:
    parameters: [{$ref: '#/components/parameters/PatientId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    post:
      tags: [Patients]
      operationId: recordConsent
      summary: Record a consent (or a refusal) at this centre
      description: Research registry consent names its protocol and is recorded by a clinician, coordinator or PI.
        409 when an active consent of the same kind (and protocol) already exists.
      x-roles: [assistant, nurse, clinician, research_coordinator, principal_investigator]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NewConsent'}}}
      responses:
        '201':
          description: Recorded
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {type: object}}}
        default: {$ref: '#/components/responses/Problem'}

  /consents/{consentId}/withdraw:
    parameters:
      - {name: consentId, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: '#/components/parameters/CentreId'}
      - {$ref: '#/components/parameters/ActingRole'}
    post:
      tags: [Patients]
      operationId: withdrawConsent
      summary: Record withdrawal; withdrawing research consent ends the enrolment that relies on it
      x-roles: [assistant, nurse, clinician, research_coordinator, principal_investigator]
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/ChangeReasonRequired'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ConsentWithdrawal'}}}
      responses:
        '200':
          description: Withdrawn
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {type: object}}}
        default: {$ref: '#/components/responses/Problem'}

  /patients/{patientId}/encounters:
    parameters: [{$ref: '#/components/parameters/PatientId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    get:
      tags: [Consultations]
      operationId: listEncounters
      summary: Consultations for the patient at this centre, newest first
      x-roles: [assistant, nurse, clinician, research_coordinator, principal_investigator]
      parameters: [{name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}]
      responses:
        '200':
          description: Consultations
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object}}}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Consultations]
      operationId: startEncounter
      summary: Start a draft consultation, written by the signed-in clinician
      x-roles: [clinician]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NewEncounter'}}}
      responses:
        '201':
          description: Draft started
          headers: {ETag: {$ref: '#/components/headers/ETag'}, Location: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Encounter'}}}
        default: {$ref: '#/components/responses/Problem'}

  /encounters/{encounterId}:
    parameters: [{$ref: '#/components/parameters/EncounterId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    get:
      tags: [Consultations]
      operationId: getEncounter
      summary: Note, complaints, assessment, vitals, diagnoses, medicine changes and amendments
      x-roles: [assistant, nurse, clinician, research_coordinator, principal_investigator]
      responses:
        '200':
          description: Consultation
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Encounter'}}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [Consultations]
      operationId: saveEncounter
      summary: Save a draft; complaints and assessment are replaced when given
      description: 409 ENCOUNTER_SIGNED once the consultation is signed; record an amendment instead.
      x-roles: [clinician, nurse]
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SaveEncounter'}}}
      responses:
        '200':
          description: Saved
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Encounter'}}}
        default: {$ref: '#/components/responses/Problem'}

  /encounters/{encounterId}/sign:
    parameters: [{$ref: '#/components/parameters/EncounterId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    post:
      tags: [Consultations]
      operationId: signEncounter
      summary: Sign and lock the note (422 when it has nothing in it)
      x-roles: [clinician]
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      responses:
        '200':
          description: Signed
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Encounter'}}}
        default: {$ref: '#/components/responses/Problem'}

  /encounters/{encounterId}/amendments:
    parameters: [{$ref: '#/components/parameters/EncounterId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    post:
      tags: [Consultations]
      operationId: amendEncounter
      summary: Amend one field of a signed note; the earlier text is kept
      x-roles: [clinician]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/EncounterAmendment'}}}
      responses:
        '201':
          description: Amended
          content: {application/json: {schema: {$ref: '#/components/schemas/Encounter'}}}
        default: {$ref: '#/components/responses/Problem'}

  /patients/{patientId}/vitals:
    parameters: [{$ref: '#/components/parameters/PatientId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    get:
      tags: [Consultations]
      operationId: listVitals
      summary: Vitals, newest first
      x-roles: [assistant, nurse, clinician, research_coordinator, principal_investigator]
      parameters: [{name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 10}}]
      responses:
        '200':
          description: Vitals
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object}}}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Consultations]
      operationId: recordVitals
      summary: Record vitals, optionally into a draft consultation; BMI is derived
      x-roles: [assistant, nurse, clinician]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NewVitals'}}}
      responses:
        '201':
          description: Recorded
          content: {application/json: {schema: {type: object}}}
        default: {$ref: '#/components/responses/Problem'}

  /patients/{patientId}/diagnoses:
    parameters: [{$ref: '#/components/parameters/PatientId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    get:
      tags: [Consultations]
      operationId: listDiagnoses
      summary: Problem list
      x-roles: [assistant, nurse, clinician, research_coordinator, principal_investigator]
      responses:
        '200':
          description: Diagnoses
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object}}}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Consultations]
      operationId: addDiagnosis
      summary: Add a diagnosis; returns any registry suggestions it raised
      description: A diagnosis typed as text needs an ICD-10 code unless it is a working diagnosis.
      x-roles: [clinician, nurse]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NewDiagnosis'}}}
      responses:
        '201':
          description: Added; new_registry_suggestions lists suggestions created by this diagnosis
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {type: object}}}
        default: {$ref: '#/components/responses/Problem'}

  /diagnoses/{diagnosisId}:
    parameters:
      - {name: diagnosisId, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: '#/components/parameters/CentreId'}
      - {$ref: '#/components/parameters/ActingRole'}
    patch:
      tags: [Consultations]
      operationId: updateDiagnosis
      summary: Change role, certainty or status (resolve, entered in error)
      x-roles: [clinician, nurse]
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/ChangeReasonRequired'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DiagnosisUpdate'}}}
      responses:
        '200':
          description: Updated
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {type: object}}}
        default: {$ref: '#/components/responses/Problem'}

  /patients/{patientId}/allergies:
    parameters: [{$ref: '#/components/parameters/PatientId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    post:
      tags: [Consultations]
      operationId: addAllergy
      summary: Record an allergy; a drug named exactly is linked to the catalogue so prescribing checks it
      x-roles: [assistant, nurse, clinician]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NewAllergy'}}}
      responses:
        '201':
          description: Recorded
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {type: object}}}
        default: {$ref: '#/components/responses/Problem'}

  /allergies/{allergyId}:
    parameters:
      - {name: allergyId, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: '#/components/parameters/CentreId'}
      - {$ref: '#/components/parameters/ActingRole'}
    patch:
      tags: [Consultations]
      operationId: updateAllergy
      summary: Mark an allergy inactive or entered in error
      x-roles: [assistant, nurse, clinician]
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/ChangeReasonRequired'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AllergyUpdate'}}}
      responses:
        '200':
          description: Updated
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {type: object}}}
        default: {$ref: '#/components/responses/Problem'}

  /concepts:
    parameters: [{$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    get:
      tags: [Consultations]
      operationId: listConcepts
      summary: Pick lists for complaints, diagnoses and medicine-change reasons
      x-roles: [assistant, nurse, clinician, research_coordinator, principal_investigator]
      parameters: [{name: domain, in: query, required: true, schema: {type: string, enum: [complaint, diagnosis, reason]}}]
      responses:
        '200':
          description: Concepts
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object}}}}}}
        default: {$ref: '#/components/responses/Problem'}

  /patients/{patientId}/clinical-summary:
    parameters: [{$ref: '#/components/parameters/PatientId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    get:
      tags: [Consultations]
      operationId: getClinicalSummary
      summary: What sits beside a consultation, from records at this centre only
      x-roles: [assistant, nurse, clinician, research_coordinator, principal_investigator]
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  last_signed_encounter: {type: [object, 'null']}
                  medications: {type: array, items: {$ref: '#/components/schemas/MedicationCourse'}}
                  diagnoses: {type: array, items: {type: object}}
                  allergies: {type: array, items: {type: object}}
                  latest_vitals: {type: [object, 'null']}
                  latest_labs: {type: array, items: {type: object}, description: Latest value per summary analyte}
                  latest_echo: {type: [object, 'null']}
                  latest_ecg: {type: [object, 'null']}
        default: {$ref: '#/components/responses/Problem'}

  /drugs:
    parameters: [{$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    get:
      tags: [Medicines]
      operationId: searchDrugs
      summary: Search the drug catalogue by generic or brand name, with products and classes
      x-roles: [assistant, nurse, clinician, research_coordinator, principal_investigator]
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 60}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Drugs
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object}}}}}}
        default: {$ref: '#/components/responses/Problem'}

  /patients/{patientId}/medications:
    parameters: [{$ref: '#/components/parameters/PatientId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    get:
      tags: [Medicines]
      operationId: listMedications
      summary: Medicine courses with their current dose
      x-roles: [assistant, nurse, clinician, research_coordinator, principal_investigator]
      parameters: [{name: include_stopped, in: query, schema: {type: boolean, default: false}}]
      responses:
        '200':
          description: Courses
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/MedicationCourse'}}}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Medicines]
      operationId: startMedication
      summary: Start a medicine, or record one prescribed elsewhere; the daily dose is computed
      description: 409 ALREADY_PRESCRIBED when the drug is already active or on hold; 409 ALLERGY when an active
        allergy names the drug or one of its classes.
      x-roles: [clinician]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NewMedication'}}}
      responses:
        '201':
          description: Started
          content: {application/json: {schema: {$ref: '#/components/schemas/MedicationCourse'}}}
        default: {$ref: '#/components/responses/Problem'}

  /medication-courses/{courseId}:
    parameters:
      - {name: courseId, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: '#/components/parameters/CentreId'}
      - {$ref: '#/components/parameters/ActingRole'}
    get:
      tags: [Medicines]
      operationId: getMedicationCourse
      summary: One course with every event
      x-roles: [assistant, nurse, clinician, research_coordinator, principal_investigator]
      responses:
        '200':
          description: Course
          content: {application/json: {schema: {$ref: '#/components/schemas/MedicationCourse'}}}
        default: {$ref: '#/components/responses/Problem'}

  /medication-courses/{courseId}/events:
    parameters:
      - {name: courseId, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: '#/components/parameters/CentreId'}
      - {$ref: '#/components/parameters/ActingRole'}
    post:
      tags: [Medicines]
      operationId: addMedicationEvent
      summary: Change dose (classified as increase, decrease, frequency or product change), hold, resume, stop or continue
      x-roles: [clinician]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MedicationCourseEvent'}}}
      responses:
        '201':
          description: Recorded
          content: {application/json: {schema: {$ref: '#/components/schemas/MedicationCourse'}}}
        default: {$ref: '#/components/responses/Problem'}

  /medication-events/{eventId}/void:
    parameters:
      - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: '#/components/parameters/CentreId'}
      - {$ref: '#/components/parameters/ActingRole'}
    post:
      tags: [Medicines]
      operationId: voidMedicationEvent
      summary: Void an event entered in error; the course status is recomputed and the entry is kept
      x-roles: [clinician]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/VoidMedicationEvent'}}}
      responses:
        '201':
          description: Voided
          content: {application/json: {schema: {$ref: '#/components/schemas/MedicationCourse'}}}
        default: {$ref: '#/components/responses/Problem'}

  /registries:
    get:
      tags: [Protocols]
      operationId: listRegistries
      summary: Registry types and the protocol versions active at the acting centre
      x-roles: [clinician, research_coordinator, principal_investigator, nurse, platform_admin]
      parameters: [{$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
      responses:
        '200':
          description: Registries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Registry'}}
        default: {$ref: '#/components/responses/Problem'}

  /protocols/{protocolId}:
    parameters: [{$ref: '#/components/parameters/ProtocolId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    get:
      tags: [Protocols]
      operationId: getProtocol
      summary: Protocol with visit schedule, endpoints and guideline rule sets
      x-roles: [clinician, research_coordinator, principal_investigator, platform_admin]
      responses:
        '200':
          description: Protocol
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Protocol'}
        default: {$ref: '#/components/responses/Problem'}

  /protocols/{protocolId}/data-dictionary:
    parameters: [{$ref: '#/components/parameters/ProtocolId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    get:
      tags: [Protocols]
      operationId: getDataDictionary
      summary: Variables the protocol collects, per visit, as JSON or CSV
      x-roles: [clinician, research_coordinator, principal_investigator, platform_admin]
      parameters:
        - name: visit_code
          in: query
          schema: {$ref: '#/components/schemas/VisitCode'}
      responses:
        '200':
          description: Dictionary rows, one per variable and visit
          content:
            application/json:
              schema:
                type: object
                required: [protocol_code, protocol_version, items]
                properties:
                  protocol_code: {type: string}
                  protocol_version: {type: integer}
                  items: {type: array, items: {$ref: '#/components/schemas/DictionaryVariable'}}
            text/csv:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}

  /registry-suggestions:
    get:
      tags: [Suggestions]
      operationId: listSuggestions
      summary: Open registry suggestions at the acting centre
      x-roles: [clinician, research_coordinator, principal_investigator, nurse]
      parameters:
        - {$ref: '#/components/parameters/CentreId'}
        - {$ref: '#/components/parameters/ActingRole'}
        - {name: status, in: query, schema: {type: string, enum: [open, screening_started, dismissed, not_eligible], default: open}}
        - {name: registry_code, in: query, schema: {$ref: '#/components/schemas/RegistryCode'}}
        - {name: patient_id, in: query, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Suggestion'}}
        default: {$ref: '#/components/responses/Problem'}

  /registry-suggestions/{suggestionId}:
    parameters:
      - {name: suggestionId, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: '#/components/parameters/CentreId'}
      - {$ref: '#/components/parameters/ActingRole'}
    patch:
      tags: [Suggestions]
      operationId: actionSuggestion
      summary: Dismiss a suggestion, or mark it not eligible. Starting screening is POST /enrolments.
      x-roles: [clinician, research_coordinator, principal_investigator]
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [dismissed, not_eligible]}
                dismiss_reason: {type: string, minLength: 3}
      responses:
        '200':
          description: Updated
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Suggestion'}}}
        default: {$ref: '#/components/responses/Problem'}

  /enrolments:
    post:
      tags: [Enrolment]
      operationId: startScreening
      summary: Start screening a patient for a protocol (enrolment_status = screening)
      description: If suggestion_id is given, that suggestion moves to screening_started in the same transaction.
      x-roles: [clinician, research_coordinator, principal_investigator]
      parameters: [{$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, protocol_id]
              properties:
                patient_id: {type: string, format: uuid}
                protocol_id: {type: string, format: uuid}
                suggestion_id: {type: string, format: uuid}
                screening_date: {type: string, format: date}
      responses:
        '201':
          description: Screening record created
          headers: {ETag: {$ref: '#/components/headers/ETag'}, Location: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Enrolment'}}}
        default: {$ref: '#/components/responses/Problem'}
    get:
      tags: [Enrolment]
      operationId: listEnrolments
      summary: Enrolments at the acting centre
      x-roles: [clinician, research_coordinator, principal_investigator]
      parameters:
        - {$ref: '#/components/parameters/CentreId'}
        - {$ref: '#/components/parameters/ActingRole'}
        - {name: protocol_id, in: query, schema: {type: string, format: uuid}}
        - {name: patient_id, in: query, schema: {type: string, format: uuid}}
        - {name: enrolment_status, in: query, schema: {$ref: '#/components/schemas/EnrolmentStatus'}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Enrolments
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Enrolment'}}
        default: {$ref: '#/components/responses/Problem'}

  /enrolments/{enrolmentId}:
    parameters: [{$ref: '#/components/parameters/EnrolmentId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    get:
      tags: [Enrolment]
      operationId: getEnrolment
      x-roles: [clinician, research_coordinator, principal_investigator]
      responses:
        '200':
          description: Enrolment with registry-specific details
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Enrolment'}}}
        default: {$ref: '#/components/responses/Problem'}

  /enrolments/{enrolmentId}/eligibility:
    parameters: [{$ref: '#/components/parameters/EnrolmentId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    put:
      tags: [Enrolment]
      operationId: recordEligibility
      summary: Record the inclusion and exclusion checklist and its result
      x-roles: [clinician, principal_investigator]
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eligibility_status, checklist]
              properties:
                eligibility_status: {type: string, enum: [eligible, ineligible]}
                checklist:
                  type: array
                  items:
                    type: object
                    required: [criterion_code, answer]
                    properties:
                      criterion_code: {type: string}
                      answer: {type: string, enum: ['yes', 'no', unknown]}
      responses:
        '200':
          description: Eligibility recorded; ineligible moves the enrolment to screen_failed
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Enrolment'}}}
        default: {$ref: '#/components/responses/Problem'}

  /enrolments/{enrolmentId}/enrol:
    parameters: [{$ref: '#/components/parameters/EnrolmentId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    post:
      tags: [Enrolment]
      operationId: enrol
      summary: Enrol an eligible patient; needs an active research consent for this protocol
      description: |
        Sets enrolment_status = enrolled, enrolment_date, index_date, consent_id and enrolled_by, writes the
        registry-specific enrolment details in the same transaction, and assigns the study subject code.
        registry.enrolment_guard refuses it without an active research_registry consent for the protocol, or
        when the protocol is not active at this site (422 CONSENT_REQUIRED / SITE_NOT_ACTIVE).
      x-roles: [clinician, principal_investigator]
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [index_date, consent_id, details]
              properties:
                enrolment_date: {type: string, format: date}
                index_date: {type: string, format: date}
                consent_id: {type: string, format: uuid}
                details:
                  description: Registry-specific enrolment details; the shape follows the protocol's registry.
                  oneOf:
                    - {$ref: '#/components/schemas/HfEnrolmentDetails'}
                    - {$ref: '#/components/schemas/LipidEnrolmentDetails'}
                    - {$ref: '#/components/schemas/CadEnrolmentDetails'}
      responses:
        '200':
          description: Enrolled; response includes the generated visit schedule
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Enrolment'}}}
        default: {$ref: '#/components/responses/Problem'}

  /enrolments/{enrolmentId}/status:
    parameters: [{$ref: '#/components/parameters/EnrolmentId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    post:
      tags: [Enrolment]
      operationId: changeEnrolmentStatus
      summary: Withdraw, mark lost to follow-up, deceased or completed
      description: Consent withdrawal is recorded on the consent itself (clinical API); the database cascade then withdraws the enrolment.
      x-roles: [clinician, principal_investigator]
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/ChangeReason'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrolment_status, status_changed_on]
              properties:
                enrolment_status: {type: string, enum: [withdrawn, lost_to_follow_up, deceased, completed]}
                status_changed_on: {type: string, format: date}
                withdrawal_reason: {type: string}
      responses:
        '200':
          description: Status changed
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Enrolment'}}}
        default: {$ref: '#/components/responses/Problem'}

  /enrolments/{enrolmentId}/schedule:
    parameters: [{$ref: '#/components/parameters/EnrolmentId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    get:
      tags: [Enrolment]
      operationId: getSchedule
      summary: Visits with target date, window and status, computed from the index date
      x-roles: [clinician, research_coordinator, principal_investigator, nurse]
      parameters:
        - {name: through, in: query, description: Expand repeating visits up to this date (default index + 5 years), schema: {type: string, format: date}}
      responses:
        '200':
          description: Schedule
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ScheduledVisit'}}
        default: {$ref: '#/components/responses/Problem'}

  /enrolments/{enrolmentId}/assessments:
    parameters: [{$ref: '#/components/parameters/EnrolmentId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    post:
      tags: [Assessments]
      operationId: createAssessment
      summary: Open an assessment for a visit
      description: days_from_index and within_window are set by the database. An out-of-window visit is accepted and flagged, not refused.
      x-roles: [clinician, research_coordinator, principal_investigator]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visit_code, assessment_type, assessment_date]
              properties:
                visit_code: {$ref: '#/components/schemas/VisitCode'}
                assessment_type: {type: string, enum: [baseline, scheduled, unscheduled, event_triggered, end_of_study]}
                contact_mode: {type: string, enum: [in_person, telephone, video, records_review, proxy], default: in_person}
                assessment_date: {type: string, format: date}
                encounter_id: {type: string, format: uuid}
                prefill: {type: boolean, default: true, description: Run prefill in the same request}
      responses:
        '201':
          description: Assessment opened
          headers: {ETag: {$ref: '#/components/headers/ETag'}, Location: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}
        default: {$ref: '#/components/responses/Problem'}
    get:
      tags: [Assessments]
      operationId: listAssessments
      x-roles: [clinician, research_coordinator, principal_investigator]
      responses:
        '200':
          description: Assessments of this enrolment, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Assessment'}}
        default: {$ref: '#/components/responses/Problem'}

  /assessments/{assessmentId}:
    parameters: [{$ref: '#/components/parameters/AssessmentId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    get:
      tags: [Assessments]
      operationId: getAssessment
      summary: Assessment with every protocol variable for its visit, filled or not
      x-roles: [clinician, research_coordinator, principal_investigator]
      responses:
        '200':
          description: Assessment
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentDetail'}}}
        default: {$ref: '#/components/responses/Problem'}

  /assessments/{assessmentId}/prefill:
    parameters: [{$ref: '#/components/parameters/AssessmentId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    post:
      tags: [Assessments]
      operationId: prefillAssessment
      summary: Fill emr_derived and calculated variables from the chart
      description: |
        Never overwrites a stored value, entered or prefilled. Each prefilled value records source_kind,
        source_table and source_row_id and stays unverified until a person confirms it. A locked assessment
        returns 422 ASSESSMENT_LOCKED. Look-back windows from the assessment date: vitals -7..+1 d, height
        365 d, labs -30..+7 d, echo -90..+7 d, clinical findings from the visit encounter or the last 7 d. Values extracted by AI arrive as
        ai_extracted and always need a person to verify them.
      x-roles: [clinician, research_coordinator, principal_investigator]
      responses:
        '200':
          description: Prefill result
          content:
            application/json:
              schema:
                type: object
                required: [filled, skipped]
                properties:
                  filled: {type: array, items: {$ref: '#/components/schemas/VariableValue'}}
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        variable_code: {type: string}
                        reason: {type: string, enum: [already_entered, already_filled, no_source_in_window, not_automated_yet, rejected_by_validation]}
                        detail: {type: string}
        default: {$ref: '#/components/responses/Problem'}

  /assessments/{assessmentId}/values:
    parameters: [{$ref: '#/components/parameters/AssessmentId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    put:
      tags: [Assessments]
      operationId: saveValues
      summary: Save one or more variable values (upsert per variable)
      description: |
        All values are saved in one transaction: one invalid value rejects the call and the response lists
        every failing variable. Each value carries its own row_version when it already exists; a stale one
        fails with 412 for that variable only. Changing a value that was saved before needs X-Change-Reason.
      x-roles: [clinician, research_coordinator, principal_investigator]
      parameters: [{$ref: '#/components/parameters/ChangeReason'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values: {type: array, minItems: 1, maxItems: 200, items: {$ref: '#/components/schemas/VariableValueInput'}}
      responses:
        '200':
          description: Saved values
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/VariableValue'}}
        default: {$ref: '#/components/responses/Problem'}

  /assessments/{assessmentId}/values/{variableCode}/verification:
    parameters:
      - {$ref: '#/components/parameters/AssessmentId'}
      - {name: variableCode, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,62}$'}}
      - {$ref: '#/components/parameters/CentreId'}
      - {$ref: '#/components/parameters/ActingRole'}
    put:
      tags: [Assessments]
      operationId: verifyValue
      summary: Mark a value verified against source, or raise a query on it
      x-roles: [clinician, research_coordinator, principal_investigator]
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verification_status]
              properties:
                verification_status: {type: string, enum: [verified, queried]}
                query_text: {type: string}
      responses:
        '200':
          description: Updated value
          content: {application/json: {schema: {$ref: '#/components/schemas/VariableValue'}}}
        default: {$ref: '#/components/responses/Problem'}

  /assessments/{assessmentId}/complete:
    parameters: [{$ref: '#/components/parameters/AssessmentId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    post:
      tags: [Assessments]
      operationId: completeAssessment
      summary: Mark complete, or missed with a reason
      description: complete is refused with 422 MANDATORY_MISSING, listing each mandatory variable with no value or value_status.
      x-roles: [clinician, research_coordinator, principal_investigator]
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completion_status]
              properties:
                completion_status: {type: string, enum: [complete, missed, not_applicable]}
                missed_reason: {type: string}
      responses:
        '200':
          description: Assessment updated
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}
        default: {$ref: '#/components/responses/Problem'}

  /assessments/{assessmentId}/lock:
    parameters: [{$ref: '#/components/parameters/AssessmentId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    post:
      tags: [Assessments]
      operationId: lockAssessment
      summary: Lock a complete assessment after monitoring; values become read-only
      description: Refused with 422 ASSESSMENT_INCOMPLETE while partial, and 422 OPEN_QUERIES while any value is queried.
      x-roles: [research_coordinator, principal_investigator]
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      responses:
        '200':
          description: Locked
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Assessments]
      operationId: unlockAssessment
      summary: Unlock for correction (PI only, reason required)
      x-roles: [principal_investigator]
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/ChangeReasonRequired'}]
      responses:
        '200':
          description: Unlocked
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}
        default: {$ref: '#/components/responses/Problem'}

  /assessments/{assessmentId}/hf/gdmt:
    parameters: [{$ref: '#/components/parameters/AssessmentId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    get:
      tags: [Heart failure]
      operationId: getGdmt
      summary: GDMT status per pillar on the assessment date, from registry.compute_gdmt
      description: Calculated live unless the assessment is locked, when the stored hf_gdmt_status rows are returned.
      x-roles: [clinician, research_coordinator, principal_investigator]
      responses:
        '200':
          description: GDMT status
          content: {application/json: {schema: {$ref: '#/components/schemas/GdmtStatus'}}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [Heart failure]
      operationId: saveGdmtReasons
      summary: Store the GDMT snapshot and the reasons a pillar is not at target
      description: |
        Stores the engine snapshot in hf_gdmt_status and adds reasons. Reasons are append-only: a request
        that leaves out a stored reason gets 409. A limiting reason (intolerance, hypotension, hyperkalaemia,
        renal_dysfunction, bradycardia, contraindication, worsening_hf) turns below_target_uptitrating into
        below_target_max_tolerated.
      x-roles: [clinician, research_coordinator, principal_investigator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasons]
              properties:
                reasons:
                  type: array
                  items:
                    type: object
                    required: [pillar, reason_code]
                    properties:
                      pillar: {$ref: '#/components/schemas/GdmtPillar'}
                      reason_code: {type: string, enum: [contraindication, intolerance, hypotension, hyperkalaemia, renal_dysfunction, bradycardia, worsening_hf, patient_refusal, financial, drug_unavailable, titration_in_progress, recently_initiated, not_indicated_for_phenotype, other]}
                      detail: {type: string, description: Required when reason_code is other}
      responses:
        '200':
          description: Stored snapshot
          content: {application/json: {schema: {$ref: '#/components/schemas/GdmtStatus'}}}
        default: {$ref: '#/components/responses/Problem'}

  /assessments/{assessmentId}/lipid/targets:
    parameters: [{$ref: '#/components/parameters/AssessmentId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    get:
      tags: [Lipid]
      operationId: getLipidTargets
      summary: LDL-C target attainment under the primary (ESC/EAS 2019) and secondary (LAI 2020) guidelines
      x-roles: [clinician, research_coordinator, principal_investigator]
      responses:
        '200':
          description: One row per guideline
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/LipidTargetAttainment'}}
                  guidelines:
                    type: array
                    items:
                      type: object
                      properties:
                        rule_set_code: {type: string}
                        version: {type: integer}
                        status: {type: string}
                        categories:
                          type: array
                          description: Risk categories this guideline defines, with their LDL-C targets
                          items:
                            type: object
                            properties:
                              risk_category: {type: string}
                              ldl_target_mg_dl: {type: number}
                              target_operator: {type: string}
                              min_pct_reduction: {type: [number, 'null']}
                        is_primary: {type: boolean}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [Lipid]
      operationId: saveLipidRiskCategories
      summary: Set the risk category under each guideline; targets and attainment are filled by the database
      description: |
        LDL-C is the ldl_c value on the form, else the nearest chart result (-30..+7 d); % reduction is from
        the lipid enrolment baseline. Changing a saved category needs X-Change-Reason (428).

        The saved categories are also written into this visit's form questions, where the protocol asks them:
        risk_category and ldl_target (ESC_EAS_2019), lai_risk_category and ldl_target_lai (LAI_2020). A
        category is stored as entered; a target as calculated, pointing at registry.lipid_target_attainment
        (source_row_id is the rule set). Replacing an answer already typed on the form needs X-Change-Reason
        (428, detail names the question); a replaced value goes back to unverified.
      x-roles: [clinician, research_coordinator, principal_investigator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categories]
              properties:
                categories:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [rule_set_code, risk_category]
                    properties:
                      rule_set_code: {type: string, examples: [ESC_EAS_2019, LAI_2020]}
                      risk_category: {type: string, examples: [very_high, extreme_a]}
      responses:
        '200':
          description: Attainment rows
          content:
            application/json:
              schema:
                type: object
                required: [items, form_values]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/LipidTargetAttainment'}}
                  form_values:
                    type: array
                    description: Form questions this call wrote or changed (empty when they already matched)
                    items: {type: string, examples: [risk_category, ldl_target]}
        default: {$ref: '#/components/responses/Problem'}

  /patients/{patientId}/pci-procedures:
    parameters: [{$ref: '#/components/parameters/PatientId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    post:
      tags: [CAD]
      operationId: createPciProcedure
      summary: Record a PCI with its lesions and stents in one request
      x-roles: [clinician]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PciProcedure'}
      responses:
        '201':
          description: Procedure stored
          headers: {ETag: {$ref: '#/components/headers/ETag'}, Location: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/PciProcedure'}}}
        default: {$ref: '#/components/responses/Problem'}
    get:
      tags: [CAD]
      operationId: listPciProcedures
      x-roles: [clinician, research_coordinator, principal_investigator, nurse]
      responses:
        '200':
          description: Procedures, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/PciProcedure'}}
        default: {$ref: '#/components/responses/Problem'}

  /pci-procedures/{procedureId}:
    parameters:
      - {name: procedureId, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: '#/components/parameters/CentreId'}
      - {$ref: '#/components/parameters/ActingRole'}
    get:
      tags: [CAD]
      operationId: getPciProcedure
      x-roles: [clinician, research_coordinator, principal_investigator, nurse]
      responses:
        '200':
          description: Procedure with lesions and stents
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/PciProcedure'}}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [CAD]
      operationId: replacePciProcedure
      summary: Replace the procedure and its lesions and stents (status final needs a change reason)
      description: |
        Lesions and stents are matched by lesion_number and sequence_number. Recorded lesions and stents
        cannot be removed (422); to withdraw a procedure, set status to entered_in_error.
      x-roles: [clinician]
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/ChangeReason'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PciProcedure'}
      responses:
        '200':
          description: Replaced
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/PciProcedure'}}}
        default: {$ref: '#/components/responses/Problem'}

  /events:
    post:
      tags: [Events]
      operationId: reportEvent
      summary: Report a clinical event once; pending adjudications are created for each protocol the patient is enrolled in whose endpoints use this event type
      x-roles: [clinician, research_coordinator, nurse]
      parameters: [{$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClinicalEvent'}
      responses:
        '201':
          description: Event stored with the adjudications it opened
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: {$ref: '#/components/schemas/ClinicalEvent'}
                  adjudications: {type: array, items: {$ref: '#/components/schemas/Adjudication'}}
        default: {$ref: '#/components/responses/Problem'}

  /events/{eventId}:
    parameters:
      - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: '#/components/parameters/CentreId'}
      - {$ref: '#/components/parameters/ActingRole'}
    get:
      tags: [Events]
      operationId: getEvent
      summary: One event with its adjudications (adjudications are empty for nurses)
      x-roles: [clinician, research_coordinator, principal_investigator, nurse]
      responses:
        '200':
          description: Event
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: {$ref: '#/components/schemas/ClinicalEvent'}
                  adjudications: {type: array, items: {$ref: '#/components/schemas/Adjudication'}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [Events]
      operationId: correctEvent
      summary: Replace an event's details, or mark it source_verified or entered_in_error
      description: |
        Type and patient never change: enter the event in error and report it again. Changing facts an
        adjudicator relied on sends decided adjudications back to pending; entered_in_error withdraws them.
      x-roles: [clinician, research_coordinator]
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/ChangeReasonRequired'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/ClinicalEvent'}
                - type: object
                  properties:
                    status: {type: string, enum: [reported, source_verified, entered_in_error]}
      responses:
        '200':
          description: Event after the change, with its adjudications
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
        default: {$ref: '#/components/responses/Problem'}

  /patients/{patientId}/events:
    parameters: [{$ref: '#/components/parameters/PatientId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    get:
      tags: [Events]
      operationId: listPatientEvents
      x-roles: [clinician, research_coordinator, principal_investigator, nurse]
      parameters:
        - {name: include_entered_in_error, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: The patient's events at this centre, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ClinicalEvent'}}
        default: {$ref: '#/components/responses/Problem'}

  /events/{eventId}/adjudications/{adjudicationId}:
    parameters:
      - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: adjudicationId, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: '#/components/parameters/CentreId'}
      - {$ref: '#/components/parameters/ActingRole'}
    put:
      tags: [Events]
      operationId: adjudicate
      summary: Record a human adjudication against the protocol's endpoint definition
      description: |
        The adjudicator is the caller and may not be the person who reported the event (422 ADJUDICATOR_CONFLICT).
        Changing an adjudicated or not-an-event decision needs X-Change-Reason. A withdrawn adjudication
        (event entered in error) is closed (409 EVENT_WITHDRAWN).
      x-roles: [principal_investigator, clinician]
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/ChangeReason'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adjudication_status]
              properties:
                adjudication_status: {type: string, enum: [in_review, adjudicated, not_an_event, insufficient_data]}
                endpoint_code: {type: string, examples: [MI, ST, BLEED_BARC35, TLR], description: 'Optional; must match the adjudication''s endpoint'}
                classification: {type: string, examples: ['1', definite, 3a, cardiovascular, ischaemic], description: 'A code of the endpoint''s classification system (ref.adjudication_classifications). When the endpoint lists qualifying classifications, meets_endpoint follows from it.'}
                meets_endpoint: {type: boolean}
                committee_reference: {type: string}
                notes: {type: string}
      responses:
        '200':
          description: Adjudication stored; adjudicated_by is the calling user
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Adjudication'}}}
        default: {$ref: '#/components/responses/Problem'}

  /protocols/{protocolId}/adjudication-queue:
    parameters: [{$ref: '#/components/parameters/ProtocolId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    get:
      tags: [Events]
      operationId: adjudicationQueue
      x-roles: [principal_investigator, clinician, research_coordinator]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [pending, in_review, insufficient_data], default: pending}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Adjudications waiting, oldest event first
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Adjudication'}}
        default: {$ref: '#/components/responses/Problem'}

  /protocols/{protocolId}/follow-up-due:
    parameters: [{$ref: '#/components/parameters/ProtocolId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    get:
      tags: [Reports]
      operationId: followUpDue
      summary: Visits whose window is open, opening within N days, or closed without an assessment
      x-roles: [clinician, research_coordinator, principal_investigator, nurse]
      parameters:
        - {name: within_days, in: query, schema: {type: integer, minimum: 0, maximum: 180, default: 14}}
        - {name: include_overdue, in: query, schema: {type: boolean, default: true}}
      responses:
        '200':
          description: Due visits with patient name and contact (clinical roles only)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - {$ref: '#/components/schemas/ScheduledVisit'}
                        - type: object
                          properties:
                            enrolment_id: {type: string, format: uuid}
                            patient_id: {type: string, format: uuid}
                            local_patient_code: {type: string}
                            patient_name: {type: string}
                            mobile: {type: [string, 'null']}
                            visit_label: {type: string}
                            days_until_window_closes: {type: integer}
                            death_reported_on: {type: [string, 'null'], format: date, description: Visits opening after a reported death are left out}
        default: {$ref: '#/components/responses/Problem'}

  /protocols/{protocolId}/missing-data:
    parameters: [{$ref: '#/components/parameters/ProtocolId'}, {$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}]
    get:
      tags: [Reports]
      operationId: missingData
      summary: Mandatory variables without a value, by visit and variable, with the assessments affected
      x-roles: [clinician, research_coordinator, principal_investigator]
      parameters:
        - {name: visit_code, in: query, schema: {$ref: '#/components/schemas/VisitCode'}}
      responses:
        '200':
          description: Missing-data summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        visit_code: {type: string}
                        variable_code: {type: string}
                        variable_label: {type: string}
                        assessments_due: {type: integer}
                        missing: {type: integer}
                        recorded_as_not_available: {type: integer, description: 'Values recorded as not_done, unknown, not_applicable or declined'}
                        queried: {type: integer}
                        assessment_ids: {type: array, items: {type: string, format: uuid}}
                  totals:
                    type: object
                    properties:
                      assessments: {type: integer}
                      mandatory_values: {type: integer}
                      missing: {type: integer}
                      completeness_pct: {type: [number, 'null']}
        default: {$ref: '#/components/responses/Problem'}

  /exports:
    get:
      tags: [Exports]
      operationId: listExports
      summary: Export jobs of the protocols the caller is a study member of, newest first
      x-roles: [research_coordinator, principal_investigator]
      parameters:
        - {$ref: '#/components/parameters/CentreId'}
        - {$ref: '#/components/parameters/ActingRole'}
        - {name: protocol_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [requested, approved, rejected, running, completed, failed, expired]}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Export jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ExportJob'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Exports]
      operationId: requestExport
      summary: Request a pseudonymised research export (status requested)
      description: |
        Needs an active study membership with export rights. variable_codes must belong to the protocol,
        centre_ids to the requester's study centres. cohort_filter keys: enrolment_status (list),
        index_year_from, index_year_to.
      x-roles: [research_coordinator, principal_investigator]
      parameters: [{$ref: '#/components/parameters/CentreId'}, {$ref: '#/components/parameters/ActingRole'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExportRequest'}
      responses:
        '201':
          description: Export requested
          headers: {Location: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/ExportJob'}}}
        default: {$ref: '#/components/responses/Problem'}

  /exports/{exportId}:
    parameters:
      - {name: exportId, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: '#/components/parameters/CentreId'}
      - {$ref: '#/components/parameters/ActingRole'}
    get:
      tags: [Exports]
      operationId: getExport
      summary: Export status; when completed, a download URL valid for 15 minutes
      x-roles: [research_coordinator, principal_investigator]
      responses:
        '200':
          description: Export job
          content: {application/json: {schema: {$ref: '#/components/schemas/ExportJob'}}}
        default: {$ref: '#/components/responses/Problem'}

  /exports/{exportId}/file:
    parameters:
      - {name: exportId, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: '#/components/parameters/CentreId'}
      - {$ref: '#/components/parameters/ActingRole'}
      - {name: expires, in: query, required: true, schema: {type: integer}}
      - {name: sig, in: query, required: true, schema: {type: string}}
    get:
      tags: [Exports]
      operationId: downloadExport
      summary: The export file (zip of CSV tables, or xlsx), for the requester only, via the signed download_url
      x-roles: [research_coordinator, principal_investigator]
      responses:
        '200':
          description: File; X-Content-SHA256 carries its hash. Every download is written to audit.access_log.
          content:
            application/zip: {}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {}
        default: {$ref: '#/components/responses/Problem'}

  /exports/{exportId}/decision:
    parameters:
      - {name: exportId, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: '#/components/parameters/CentreId'}
      - {$ref: '#/components/parameters/ActingRole'}
    post:
      tags: [Exports]
      operationId: decideExport
      summary: Approve or reject; the approver must not be the requester (four-eyes)
      description: |
        After the decision commits, an approved export is generated as the requester, with the requester's
        role and study access, so it never holds more than they may see. Files are kept for
        CEMR_EXPORT_RETENTION_DAYS (default 7).
      x-roles: [principal_investigator]
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [approved, rejected]}
                note: {type: string}
      responses:
        '200':
          description: Decision stored; approved exports start running
          content: {application/json: {schema: {$ref: '#/components/schemas/ExportJob'}}}
        default: {$ref: '#/components/responses/Problem'}

components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.example.org/.well-known/openid-configuration

  parameters:
    CentreId:
      name: X-Centre-Id
      in: header
      required: true
      description: Acting centre; becomes app.centre_id for RLS.
      schema: {type: string, format: uuid}
    ActingRole:
      name: X-Acting-Role
      in: header
      required: true
      description: Role held at the acting centre; becomes SET LOCAL ROLE r_<role>.
      schema:
        type: string
        enum: [assistant, nurse, clinician, research_coordinator, principal_investigator, centre_admin, platform_admin, audit_reader]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 64}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Current ETag (row_version) of the resource.
      schema: {type: string}
    ChangeReason:
      name: X-Change-Reason
      in: header
      required: false
      description: Required when the call changes data saved earlier; stored in the audit log.
      schema: {type: string, minLength: 3, maxLength: 500}
    ChangeReasonRequired:
      name: X-Change-Reason
      in: header
      required: true
      schema: {type: string, minLength: 3, maxLength: 500}
    ProtocolId:
      name: protocolId
      in: path
      required: true
      schema: {type: string, format: uuid}
    EnrolmentId:
      name: enrolmentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    EncounterId:
      name: encounterId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PatientId:
      name: patientId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}

  headers:
    ETag:
      description: Quoted row_version of the resource
      schema: {type: string}

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    NewConsent:
      additionalProperties: false
      properties:
        consent_type:
          enum: [clinical_care, research_registry, cross_centre_linkage, external_data_sharing, ai_processing, recontact]
          type: string
        protocol_id:
          default: null
          description: Required for research_registry, and only then
          format: uuid
          type: [string, 'null']
        consent_form_version: {maxLength: 50, minLength: 1, type: string}
        consent_language:
          default: null
          maxLength: 40
          type: [string, 'null']
        consent_date: {format: date, type: string}
        consent_method:
          enum: [written, electronic, audio_video, verbal_witnessed, waiver_approved]
          type: string
        signed_by:
          default: patient
          enum: [patient, legally_authorised_rep]
          type: string
        lar_name:
          default: null
          maxLength: 200
          type: [string, 'null']
        lar_relation:
          default: null
          maxLength: 100
          type: [string, 'null']
        witness_name:
          default: null
          maxLength: 200
          type: [string, 'null']
        consent_status:
          default: active
          enum: [active, refused]
          type: string
      required: [consent_type, consent_form_version, consent_date, consent_method]
      type: object
    ConsentWithdrawal:
      additionalProperties: false
      properties:
        withdrawal_date: {format: date, type: string}
        withdrawal_scope:
          enum: [no_further_contact, no_further_collection, exclude_collected_data]
          type: string
        withdrawal_reason:
          default: null
          maxLength: 500
          type: [string, 'null']
      required: [withdrawal_date, withdrawal_scope]
      type: object
    AllergyUpdate:
      additionalProperties: false
      properties:
        status:
          enum: [active, inactive, entered_in_error]
          type: string
      required: [status]
      type: object
    ClinicalAssessment:
      additionalProperties: false
      properties:
        nyha_class:
          default: null
          enum: [I, II, III, IV, null]
          type: [string, 'null']
        ccs_class:
          default: null
          enum: ['0', I, II, III, IV, null]
          type: [string, 'null']
        killip_class:
          default: null
          enum: [I, II, III, IV, null]
          type: [string, 'null']
        jvp:
          default: null
          enum: [normal, raised, not_assessable, null]
          type: [string, 'null']
        jvp_cm:
          default: null
          maximum: 30
          minimum: 0
          type: [number, 'null']
        peripheral_oedema:
          default: null
          enum: [none, ankle, below_knee, above_knee, sacral, anasarca, null]
          type: [string, 'null']
        pulmonary_rales:
          default: null
          type: [boolean, 'null']
        s3_gallop:
          default: null
          type: [boolean, 'null']
        orthopnoea:
          default: null
          type: [boolean, 'null']
        pnd:
          default: null
          type: [boolean, 'null']
        congestion_status:
          default: null
          enum: [euvolaemic, mild, moderate, severe, null]
          type: [string, 'null']
        hf_phenotype:
          default: null
          enum: [HFrEF, HFmrEF, HFpEF, HFimpEF, null]
          type: [string, 'null']
        cv_risk_category:
          default: null
          enum: [low, moderate, high, very_high, extreme, null]
          type: [string, 'null']
      type: object
    DiagnosisUpdate:
      additionalProperties: false
      properties:
        diagnosis_role:
          default: null
          enum: [working, final, comorbidity, past_history, complication, null]
          type: [string, 'null']
        certainty:
          default: null
          enum: [suspected, confirmed, refuted, null]
          type: [string, 'null']
        is_principal:
          default: null
          type: [boolean, 'null']
        status:
          default: null
          enum: [active, resolved, entered_in_error, null]
          type: [string, 'null']
        resolved_date:
          default: null
          format: date
          type: [string, 'null']
      type: object
    EncounterAmendment:
      additionalProperties: false
      properties:
        field_name:
          enum: [presenting_complaint, history_present_illness, clinical_history, examination_cvs, examination_resp, examination_other,
            assessment, plan, lifestyle_advice, patient_education, referral_to]
          type: string
        amended_value: {maxLength: 20000, type: string}
        reason: {maxLength: 500, minLength: 5, type: string}
      required: [field_name, amended_value, reason]
      type: object
    EncounterComplaint:
      additionalProperties: false
      properties:
        concept_code: {pattern: '^CX_[A-Z_]+$', type: string}
        duration_value:
          default: null
          maximum: 1000
          minimum: 0
          type: [number, 'null']
        duration_unit:
          default: null
          enum: [hours, days, weeks, months, years, null]
          type: [string, 'null']
        detail:
          default: null
          maxLength: 1000
          type: [string, 'null']
      required: [concept_code]
      type: object
    EncounterNoteFields:
      additionalProperties: false
      properties:
        encounter_type:
          default: null
          enum: [new_consultation, follow_up, registry_visit, teleconsultation, telephone, inpatient_review, emergency, procedure,
            retrospective_entry, null]
          type: [string, 'null']
        setting:
          default: null
          enum: [outpatient, inpatient, emergency, remote, null]
          type: [string, 'null']
        presenting_complaint:
          default: null
          maxLength: 20000
          type: [string, 'null']
        history_present_illness:
          default: null
          maxLength: 20000
          type: [string, 'null']
        clinical_history:
          default: null
          maxLength: 20000
          type: [string, 'null']
        examination_cvs:
          default: null
          maxLength: 20000
          type: [string, 'null']
        examination_resp:
          default: null
          maxLength: 20000
          type: [string, 'null']
        examination_other:
          default: null
          maxLength: 20000
          type: [string, 'null']
        assessment:
          default: null
          maxLength: 20000
          type: [string, 'null']
        plan:
          default: null
          maxLength: 20000
          type: [string, 'null']
        lifestyle_advice:
          default: null
          maxLength: 20000
          type: [string, 'null']
        patient_education:
          default: null
          maxLength: 20000
          type: [string, 'null']
        referral_to:
          default: null
          maxLength: 500
          type: [string, 'null']
        follow_up_date:
          default: null
          format: date
          type: [string, 'null']
      type: object
    MedicationCourseEvent:
      additionalProperties: false
      properties:
        event_type:
          enum: [dose_change, hold, resume, discontinue, reconcile_continue]
          type: string
        effective_date:
          default: null
          format: date
          type: [string, 'null']
        dose:
          anyOf:
          - {$ref: '#/components/schemas/MedicationDose'}
          - {type: 'null'}
          default: null
          description: Required for dose_change
        reason_code:
          default: null
          pattern: ^RSN_[A-Z_]+$
          type: [string, 'null']
        reason_text:
          default: null
          maxLength: 500
          type: [string, 'null']
        encounter_id:
          default: null
          format: uuid
          type: [string, 'null']
      required: [event_type]
      type: object
    MedicationDose:
      additionalProperties: false
      properties:
        product_id:
          default: null
          format: uuid
          type: [string, 'null']
        brand_name_text:
          default: null
          maxLength: 200
          type: [string, 'null']
        strength:
          default: null
          description: Per tablet/capsule/ml/unit, in the drug's reference unit; taken from the product when product_id is given
          exclusiveMinimum: 0
          maximum: 100000
          type: [number, 'null']
        strength_label:
          default: null
          maxLength: 50
          type: [string, 'null']
        dose_quantity: {exclusiveMinimum: 0, maximum: 1000, type: number}
        dose_unit:
          default: tablet
          enum: [tablet, capsule, mg, mcg, ml, unit, puff, sachet, injection]
          type: string
        frequency_code:
          enum: [OD, BD, TDS, QID, HS, weekly, Q2W, Q4W, Q6M, SOS, other]
          type: string
        doses_per_day:
          default: null
          description: Needed for SOS and other
          exclusiveMinimum: 0
          maximum: 24
          type: [number, 'null']
        route:
          default: null
          enum: [oral, sublingual, iv, sc, im, inhaled, transdermal, topical, other, null]
          type: [string, 'null']
        duration_days:
          default: null
          exclusiveMinimum: 0
          maximum: 3650
          type: [integer, 'null']
        instructions:
          default: null
          maxLength: 1000
          type: [string, 'null']
